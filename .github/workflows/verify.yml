name: Verify supplier onboarding
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: cases
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cases"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:isolated-test-password@localhost:5432/cases
      DOTNET: dotnet
      RUN_INTERPROCESS: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11.11"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22.12.0"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.407"
      - name: Install pinned Python dependencies
        run: python -m pip install -e . -r requirements-test.txt
      - name: Build console
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - name: Run protocol state security and real process tests
        run: python -m unittest discover -v
      - name: Install test browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise independent operator approval in Chromium
        run: python scripts/run_browser_check.py
      - name: Check whitespace
        run: git diff --check
